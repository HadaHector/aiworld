<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiworld</title>
    <style>
      html, body, #renderCanvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        display: block;
        overflow: hidden;
      }

      /* Inlined, and markup-first, so the overlay is painted on the very first frame - building it
         from TypeScript would leave a blank canvas until the module graph has loaded and parsed. */
      #loadingScreen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(circle at 50% 42%, #2b3a4a 0%, #131a22 70%);
        color: #dfe6ee;
        font: 400 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
        transition: opacity 0.4s ease;
      }

      #loadingScreen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loadingTitle {
        font-size: 22px;
        font-weight: 300;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.85;
      }

      #loadingTrack {
        width: min(320px, 60vw);
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }

      #loadingBar {
        width: 0%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #6fa8c7, #a9d3e4);
        transition: width 0.25s ease;
      }

      /* Used for phases with no countable steps, so the bar still reads as "working". */
      #loadingBar.indeterminate {
        width: 100%;
        transition: none;
        animation: loadingSweep 1.1s ease-in-out infinite;
        transform-origin: left center;
      }

      @keyframes loadingSweep {
        0% { transform: scaleX(0.05); opacity: 0.5; }
        50% { transform: scaleX(0.7); opacity: 1; }
        100% { transform: scaleX(0.05); opacity: 0.5; }
      }

      #loadingPhase {
        opacity: 0.75;
        min-height: 1.2em;
      }

      @media (prefers-reduced-motion: reduce) {
        #loadingBar.indeterminate { animation: none; transform: scaleX(0.6); }
        #loadingScreen { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="loadingScreen">
      <div id="loadingTitle">aiworld</div>
      <div id="loadingTrack"><div id="loadingBar" class="indeterminate"></div></div>
      <div id="loadingPhase">Loading</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiworld fx</title>
    <style>
      :root {
        --bg: #161b21;
        --panel: #1d242c;
        --line: #333e4b;
        --text: #dfe6ee;
        --muted: #8d9aa8;
        --accent: #6fa8c7;
        --now: #2b3a48;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
      #app { display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: auto 1fr; height: 100%; }
      #main { display: grid; grid-template-rows: minmax(0, 52%) minmax(0, 1fr); min-height: 0; }
      #stage { width: 100%; height: 100%; display: block; outline: none; border-bottom: 1px solid var(--line); }
      header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { font-size: 14px; margin: 0 6px 0 0; font-weight: 600; }
      header label { display: flex; align-items: center; gap: 5px; color: var(--muted); }
      header output { min-width: 44px; color: var(--text); font-variant-numeric: tabular-nums; }
      select, button, input { font: inherit; color: var(--text); background: #242c36; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
      input[type="range"] { padding: 0; }
      button:hover { border-color: var(--accent); }
      button.on { background: var(--accent); color: #10151a; border-color: var(--accent); }
      #list { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 10px; }
      #list input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
      #list .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
      #list .tabs button { flex: 1; }
      #list .item { padding: 3px 6px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
      #list .item:hover { background: #242c36; }
      #list .item.selected { background: var(--now); }
      #list .item small { color: var(--muted); }
      h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 6px; }
      #detail { overflow-y: auto; padding: 12px 16px; min-height: 0; }
      #detail canvas.atlas { width: auto; max-width: 100%; height: auto; image-rendering: pixelated; background: repeating-conic-gradient(#20262e 0 25%, #171b21 0 50%) 0 0 / 16px 16px; }
      #detail .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
      #detail .facts { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 10px; }
      #detail .facts b { color: var(--text); font-weight: 500; }
      #detail canvas { width: 100%; height: 70px; display: block; background: #12161b; border: 1px solid var(--line); border-radius: 3px; margin-bottom: 6px; }
      .layer { border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; color: #b9c3ce; }
      .layer .tag { font: 11px system-ui, sans-serif; color: #10151a; background: #c9a35e; border-radius: 3px; padding: 0 4px; margin-left: 6px; }
      .hint { color: var(--muted); font-size: 12px; }
      .error { color: #f08080; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>aiworld fx</h1>
        <label>Distance <input id="distance" type="range" min="0" max="60" step="0.5" value="4" /><output id="distanceOut"></output></label>
        <label>Angle <input id="angle" type="range" min="-180" max="180" step="5" value="0" /><output id="angleOut"></output></label>
        <label>Speed <input id="speed" type="range" min="0.05" max="1" step="0.05" value="1" /><output id="speedOut"></output></label>
        <label>Volume <input id="volume" type="range" min="0" max="100" value="70" /></label>
        <label>Voices <output id="voices">0</output></label>
        <label>Particles <output id="particles">0</output></label>
        <button id="stop">■ Stop all</button>
        <span id="status" class="hint">Click anywhere to start the audio.</span>
      </header>
      <div id="list"></div>
      <div id="main">
        <canvas id="stage"></canvas>
        <div id="detail"></div>
      </div>
    </div>
    <script type="module" src="/src/fxPage/main.ts"></script>
  </body>
</html>

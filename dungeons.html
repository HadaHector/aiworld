<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiworld dungeons</title>
    <style>
      :root {
        --bg: #161b21;
        --panel: #1d242c;
        --line: #333e4b;
        --text: #dfe6ee;
        --muted: #8d9aa8;
        --accent: #6fa8c7;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      #app { display: grid; grid-template-columns: 1fr 260px; height: 100%; }
      #plans { overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; align-content: start; }
      .plan { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
      .plan canvas { width: 100%; display: block; background: #12171c; border-radius: 4px; }
      .plan .title { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
      .plan .title span { color: var(--muted); }
      .plan a { color: var(--accent); }
      #panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px; }
      h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; }
      h2:first-child { margin-top: 0; }
      select, input, button { font: inherit; color: var(--text); background: #242c36; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; box-sizing: border-box; }
      select, input { width: 100%; margin-bottom: 6px; }
      .row { display: flex; gap: 6px; }
      .row button { flex: 1; }
      .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
      .legend div { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
      .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
      #error { color: #e88; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="plans"></div>
      <div id="panel">
        <h2>Layouts</h2>
        <label>Style<select id="style"></select></label>
        <label>Size<select id="size"></select></label>
        <label>Ground<select id="ground"></select></label>
        <label>First seed<input id="seed" type="number" value="1" /></label>
        <label>How many<input id="count" type="number" value="6" min="1" max="24" /></label>
        <div class="row"><button id="prev">&lt; Seeds</button><button id="next">Seeds &gt;</button></div>
        <h2>Legend</h2>
        <div class="legend" id="legend"></div>
        <p class="hint">Each layout as a plan from above (darker is deeper; lines join the parts), and under it a side view along the way in, the ground's line over it - every part must lie the style's cover under it. "Walk it" opens it in the collision sandbox.</p>
        <div id="error"></div>
      </div>
    </div>
    <script type="module" src="/src/dungeonPage/main.ts"></script>
  </body>
</html>

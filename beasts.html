<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiworld beasts</title>
    <style>
      :root {
        --bg: #161b21;
        --panel: #1d242c;
        --line: #333e4b;
        --text: #dfe6ee;
        --muted: #8d9aa8;
        --accent: #6fa8c7;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
      #app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto 1fr; height: 100%; }
      header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { font-size: 14px; margin: 0 6px 0 0; font-weight: 600; }
      header label { display: flex; align-items: center; gap: 5px; color: var(--muted); }
      header output { min-width: 40px; color: var(--text); font-variant-numeric: tabular-nums; }
      select, button, input { font: inherit; color: var(--text); background: #242c36; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
      input[type="range"] { padding: 0; }
      input[type="number"] { width: 70px; }
      button:hover { border-color: var(--accent); }
      #stage { width: 100%; height: 100%; display: block; outline: none; }
      #side { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px; }
      #side h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 12px 0 6px; }
      #side table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      #side td { padding: 2px 4px; border-bottom: 1px solid #262e38; vertical-align: top; }
      #side canvas { width: 100%; image-rendering: pixelated; background: #000; margin-bottom: 8px; }
      .error { color: #f08080; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; }
      .hint { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>aiworld beasts</h1>
        <label>Show <select id="only"></select></label>
        <label>Seeds <input id="seeds" type="number" min="1" max="12" value="4" /></label>
        <label>First seed <input id="seed" type="number" min="0" value="1" /></label>
        <label>Play <select id="play"></select></label>
        <label>Speed <input id="speed" type="range" min="0" max="8" step="0.1" value="1.1" /><output id="speedOut"></output></label>
        <label>Path <select id="path"><option value="place">On the spot</option><option value="line">Walking past</option></select></label>
        <label>Atlas <select id="atlas"><option value="256">256</option><option value="512">512</option><option value="128">128 retro</option></select></label>
        <label>Traits <input id="traits" placeholder="rabid old" size="10" /></label>
        <label><input id="wire" type="checkbox" /> Wire</label>
        <label><input id="bones" type="checkbox" /> Bones</label>
        <span id="status" class="hint"></span>
      </header>
      <canvas id="stage"></canvas>
      <div id="side"></div>
    </div>
    <script type="module" src="/src/beastsPage/main.ts"></script>
  </body>
</html>
